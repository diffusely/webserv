server {
	listen 8080;
	server_name localhost;
	root ./www;
	index index.html;
	client_max_body_size 10M;
	error_page 404 /errors/404.html;

	location / {
		methods GET;
	}

	location /uploads {
		methods GET POST DELETE;
		autoindex on;
		upload_store ./www/uploads;
	}

	location /old {
		return 301 /;
	}
}
